<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>BNU · 实验体监控终端</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="subject_monitor.css">
</head>
<body>
<div class="app">
  <header>
    <div class="title">BNU · <span>SUBJECT MONITOR</span></div>
    <div class="time-bar">
      <span class="time-label" id="time-display">第 1 天 · 00:00</span>
      <button class="btn-time" id="btn-next-day">下一天</button>
      <button class="btn-log" id="btn-hud-debug">HUD 调试</button>
    </div>
    <div class="status" id="header-status">
      当前实验体：——
    </div>
  </header>

  <div class="main">
    <!-- 左侧：实验体列表 -->
    <aside class="sidebar">
      <div class="sidebar-title">
        实验体 / SUBJECTS
        <span class="resource-help" data-tip="异化达到 100% 将丢失监控，无法再刷新或采集。">i</span>
      </div>
      <div id="subject-list"></div>
    </aside>

    <!-- 中间：监控屏幕 -->
    <section class="monitor">
      <div class="monitor-header">
        <div class="monitor-title">LIVE OBSERVATION</div>
        <div class="monitor-subtitle" id="monitor-subtitle">选择左侧实验体开始观察</div>
      </div>

      <div class="monitor-screen" id="monitor-screen">
        <div class="screen-label"></div>
        <div class="screen-body" id="screen-body">
          <div class="scan-line" id="scan-line"></div>
          <div class="scan-noise"></div>
          <div class="lost-overlay" id="lost-overlay">已丢失观测结果</div>
          <div class="preview-grid" id="preview-grid"></div>
          <div class="silhouette" id="silhouette">
            <img class="silhouette-image" id="silhouette-img" alt="实验体红外轮廓" />
            <div class="tail"></div>
          </div>
          <div class="hud-frames" id="hud-frames"></div>
          <div class="waveform-panel" id="waveform-panel">
            <div class="wave-item">
              <div class="wave-label">
                <span>ECG · 心率</span>
                <span class="wave-value" id="wave-heart-text">——</span>
              </div>
              <div class="wave-graph heart">
                <div class="wave-line" id="wave-heart"></div>
              </div>
            </div>
            <div class="wave-item">
              <div class="wave-label">
                <span>EEG · 脑电</span>
                <span class="wave-value" id="wave-brain-text">——</span>
              </div>
              <div class="wave-graph brain">
                <div class="wave-line" id="wave-brain"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="screen-footer"></div>
      </div>

      <div class="monitor-info">
        <div class="info-card">
          <div class="info-label">实验体代号</div>
          <div class="info-value" id="info-id">——</div>
          <div class="info-desc" id="info-species">物种：——</div>
        </div>
        <div class="info-card">
          <div class="info-label">异化阶段</div>
          <div class="info-value" id="info-stage">未监控</div>
          <div class="info-desc" id="info-risk">风险：——</div>
        </div>
        <div class="info-card">
          <div class="info-label">观察备注</div>
          <div class="info-desc" id="info-note">
            选择实验体后，将在此显示关键行为特征。
          </div>
        </div>
      </div>

      <div class="vitals">
        <div class="vitals-row">
          <div class="vital-label">心率</div>
          <div class="vital-bar">
            <div class="vital-fill heart" id="vital-heart"></div>
          </div>
          <div class="vital-value" id="vital-heart-text">——</div>
        </div>
        <div class="vitals-row">
          <div class="vital-label">脑电活动</div>
          <div class="vital-bar">
            <div class="vital-fill brain" id="vital-brain"></div>
          </div>
          <div class="vital-value" id="vital-brain-text">——</div>
        </div>
        <div class="vitals-row">
          <div class="vital-label">异化进度</div>
          <div class="vital-bar">
            <div class="vital-fill shift" id="vital-shift"></div>
          </div>
          <div class="vital-value" id="vital-shift-text">0%</div>
        </div>
      </div>

      <div class="resources">
        <div class="resource-item">
          <div class="resource-label">采集许可</div>
          <div class="resource-value" id="permit-text">10 / 10</div>
        </div>
        <div class="resource-item resource-stabilizer">
          <div class="resource-label">稳定剂</div>
          <div class="resource-inline">
            <div class="resource-value" id="stabilizer-text">3 支</div>
            <button class="btn btn-ghost" id="btn-stabilizer">使用稳定剂</button>
            <span class="resource-help" data-tip="待命后可抵消下一次采集产生的异化增长，生效即消耗一支。">i</span>
          </div>
        </div>
        <div class="resource-item">
          <div class="resource-label">研究进度</div>
          <div class="resource-progress">
            <div class="resource-progress-fill" id="research-fill"></div>
          </div>
          <div class="resource-value" id="research-text">0%</div>
        </div>
      </div>

      <div class="monitor-buttons">
        <button class="btn" id="btn-preview">快捷预览</button>
        <button class="btn" id="btn-sample">采集数据</button>
        <button class="btn" id="btn-random">刷新生命体征</button>
      </div>
    </section>

    <!-- 右侧：监控日志 -->
    <aside class="log-panel">
      <div class="log-header">
        <div>
          <div class="log-title">
            监控日志 / LOG
            <span class="resource-help" data-tip="红色：异常/高风险；橙色：次级风险；常规颜色：普通记录。">i</span>
          </div>
          <div class="log-sub">记录当前实验体的关键事件与异常行为。</div>
        </div>
        <button class="btn-log" id="btn-alert-log">异常日志</button>
      </div>
      <div class="log-list" id="log-list"></div>
    </aside>
  </div>
</div>

<!-- 新手教程遮罩 -->
<div class="guide-mask" id="guide-mask" hidden>
  <div class="guide-overlay" id="guide-overlay"></div>
  <div class="guide-card" id="guide-card">
    <div class="guide-step" id="guide-step"></div>
    <div class="guide-text" id="guide-text"></div>
    <div class="guide-actions">
      <button class="btn" id="guide-prev">上一步</button>
      <button class="btn" id="guide-next">下一步</button>
      <button class="btn" id="guide-skip">跳过教程</button>
    </div>
  </div>
</div>

<script type="module" src="pages/subject_monitor.js"></script>
</body>
</html>
