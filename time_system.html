<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>时间系统</title>
  <link rel="stylesheet" href="time_system.css">
</head>
<body>
  <div class="time-container">
    <div class="time-bar">
      <span class="time-label" id="time-display">第 1 天 · 00:00</span>
      <button class="btn-time" id="btn-next-day">下一天</button>
    </div>
  </div>

  <script>
    const timeDisplay = document.getElementById("time-display");
    const btnNextDay = document.getElementById("btn-next-day");
    const gameTime = { day: 1, minutes: 0 }; // 1 real second = 1 game minute
    let timeTimer = null;

    function pad(num) { return num.toString().padStart(2, "0"); }
    function formatGameTime() {
      const hours = Math.floor(gameTime.minutes / 60);
      const mins = gameTime.minutes % 60;
      return `第 ${gameTime.day} 天 · ${pad(hours)}:${pad(mins)}`;
    }
    function updateTimeDisplay() {
      if (timeDisplay) timeDisplay.textContent = formatGameTime();
    }
    function advanceMinutes(minutes = 1) {
      gameTime.minutes += minutes;
      while (gameTime.minutes >= 1440) {
        gameTime.minutes -= 1440;
        gameTime.day += 1;
      }
      updateTimeDisplay();
    }
    function startTimeSystem() {
      updateTimeDisplay();
      clearInterval(timeTimer);
      timeTimer = setInterval(() => advanceMinutes(1), 1000);
    }
    btnNextDay.addEventListener("click", () => {
      gameTime.day += 1;
      gameTime.minutes = 0;
      updateTimeDisplay();
    });

    startTimeSystem();
  </script>
</body>
</html>
